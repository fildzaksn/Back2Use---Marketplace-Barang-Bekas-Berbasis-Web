<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hubungi Kami</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="call-center">
    <section class="kartu">
      <h1>Hubungi Kami</h1>
      <p>
        Kirimkan pertanyaan atau saran Anda melalui formulir <br>
        di bawah ini
    </p>

      <form>
        <label for="nama">Nama Lengkap</label>
        <input id="nama" name="nama" type="text" placeholder="Masukkan nama Anda" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="nama@email.com" required>

        <label for="pesan">Pesan</label>
        <textarea id="pesan" name="pesan" placeholder="Tulis pesan Anda di sini..." required></textarea>

        <button type="submit">Kirim Pesan</button>
      </form>
    </section>
  </main>
</body>
</html>
